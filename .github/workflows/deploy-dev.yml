name: Deploy to Dev (Staging)

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Allow manual triggering

# Cancel in-progress deployments for the same branch
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version (dev-{sha})
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="dev-${SHORT_SHA}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building with version: $VERSION"

      - name: Build project with version
        env:
          VERSION: ${{ env.VERSION }}
        run: make build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist/ directory not found"
            exit 1
          fi
          echo "✅ Build successful - dist/ directory exists"
          echo "📊 Build size:"
          du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30
          compression-level: 9

      - name: Deploy to Cloudflare Pages (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying to dev-richarddrew-photography..."
          npx wrangler pages deploy dist/ \
            --project-name=dev-richarddrew-photography \
            --branch=develop \
            --commit-hash=${{ github.sha }}

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "📦 Version: ${{ env.VERSION }}"
          echo "🌐 Environment: Staging (dev-richarddrew-photography)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
