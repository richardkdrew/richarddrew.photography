name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

# Cancel in-progress deployments for the same branch
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tagging

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 1.0.0
          PRERELEASE: false
          DRY_RUN: false

      - name: Tag summary
        run: |
          echo "🏷️ New version tag created: ${{ steps.tag_version.outputs.new_tag }}"
          echo "📝 Previous tag: ${{ steps.tag_version.outputs.tag }}"

  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          echo "VERSION=${{ needs.tag.outputs.new_tag }}" >> $GITHUB_ENV
          echo "📦 Building with version: ${{ needs.tag.outputs.new_tag }}"

      - name: Build project with version
        env:
          VERSION: ${{ env.VERSION }}
        run: make build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist/ directory not found"
            exit 1
          fi
          echo "✅ Build successful - dist/ directory exists"
          echo "📊 Build size:"
          du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ needs.tag.outputs.new_tag }}
          path: dist/
          retention-days: 30
          compression-level: 9

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying to richarddrew.photography..."
          npx wrangler pages deploy dist/ \
            --project-name=richarddrew-photography \
            --branch=main

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          release_name: Release ${{ needs.tag.outputs.new_tag }}
          body: |
            ## 🚀 Production Deployment

            **Version**: ${{ needs.tag.outputs.new_tag }}
            **Commit**: ${{ github.sha }}
            **Deployed by**: ${{ github.actor }}

            ### Changes
            ${{ needs.tag.outputs.changelog }}

            ### Deployment Details
            - **Environment**: Production (richarddrew-photography)
            - **Build**: Artifact available for 30 days
            - **Timestamp**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      - name: Deployment summary
        run: |
          echo "✅ Production deployment complete!"
          echo "🏷️ Version: ${{ needs.tag.outputs.new_tag }}"
          echo "🌐 Environment: Production (richarddrew-photography)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
