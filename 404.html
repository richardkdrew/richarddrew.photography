<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Richard Drew Photography</title>
  <meta name="description" content="The page you're looking for cannot be found" />
  <meta name="theme-color" content="#2C2C2C" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />

  <!-- Google Fonts: async load to avoid render-blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Lora:wght@300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Lora:wght@300;400;500&display=swap" /></noscript>

  <!-- FOUC Prevention: Set theme before CSS parse -->
  <script>
    (function() {
      // Add initial-load class to disable transitions during page load
      document.documentElement.classList.add('initial-load');

      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.dataset.theme = theme;
      } else {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <!-- Preload critical fonts for performance -->
  <link rel="preload" href="/fonts/BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin />

  <!-- Icons and PWA -->
  <link rel="icon" type="image/x-icon" href="/images/branding/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/branding/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- 404 page specific styles -->
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      gap: var(--space-md);
    }

    .error-code {
      font-family: var(--font-header);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: var(--weight-regular);
      color: var(--color-primary);
      line-height: 1;
      margin: 0;
      letter-spacing: 0.04em;
      opacity: 0.2;
    }

    .error-heading {
      font-family: var(--font-header);
      font-size: var(--text-3xl);
      font-weight: var(--weight-regular);
      color: var(--color-primary);
      letter-spacing: 0.08em;
      margin: calc(var(--space-md) * -1) 0 0;
    }

    .error-message {
      font-family: var(--font-caption);
      font-size: var(--text-base);
      color: var(--color-secondary);
      margin: 0;
      max-width: 28rem;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
      justify-content: center;
      margin-top: var(--space-sm);
    }

    .error-link {
      font-family: var(--font-navigation);
      font-size: var(--text-sm);
      font-weight: var(--weight-regular);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: var(--space-sm) var(--space-lg);
      border-radius: 0.1875rem;
      border: 0.0625rem solid var(--color-primary);
      color: var(--color-primary);
      background: transparent;
      transition:
        background-color var(--transition-medium),
        border-color var(--transition-medium),
        color var(--transition-medium);
    }

    .error-link:hover,
    .error-link:focus-visible {
      background-color: var(--color-interactive);
      border-color: var(--color-interactive);
      color: var(--color-pure);
    }

    .error-link-primary {
      background-color: var(--color-primary);
      color: var(--color-pure);
      border-color: var(--color-primary);
    }

    .error-link-primary:hover,
    .error-link-primary:focus-visible {
      background-color: var(--color-interactive);
      border-color: var(--color-interactive);
      color: var(--color-pure);
    }
  </style>
</head>
<body>
  <portfolio-header data-current-page="" style="view-transition-name: header"></portfolio-header>

  <!-- Page Container - Unified Width Management -->
  <div class="page-container">
    <main style="view-transition-name: main">
      <div class="error-container">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 class="error-heading">Not in Focus</h1>
        <p class="error-message">
          Maybe the subject moved out of frame.
        </p>
        <div class="error-actions">
          <a href="/" class="error-link error-link-primary">Return Home</a>
        </div>
      </div>
    </main>
  </div>

  <!-- Main application script for header component -->
  <script type="module" src="/src/pages/main.ts"></script>

  <!-- Mark as JS-loaded for progressive enhancement -->
  <script>
    document.documentElement.classList.add('js-loaded');

    // Remove initial-load class to enable transitions after page is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.documentElement.classList.remove('initial-load');
      }, 50);
    });

    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(() => {
            // Silently fail - PWA is optional enhancement
          });
      });
    }
  </script>

  <!-- Site Footer -->
  <portfolio-footer></portfolio-footer>
</body>
</html>
