<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Richard Drew Photography</title>
  <meta name="description" content="The page you're looking for cannot be found" />
  <meta name="theme-color" content="#2C2C2C" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />

  <!-- FOUC Prevention: Set theme before CSS parse -->
  <script>
    (function() {
      // Add initial-load class to disable transitions during page load
      document.documentElement.classList.add('initial-load');

      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.dataset.theme = theme;
      } else {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <!-- Preload critical fonts for performance -->
  <link rel="preload" href="/fonts/BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin />

  <!-- Icons and PWA -->
  <link rel="icon" type="image/x-icon" href="/images/branding/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/branding/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/branding/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/branding/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Import Fonts -->
  <link rel="stylesheet" href="/src/styles/fonts.css">

  <!-- Import Design System -->
  <link rel="stylesheet" href="/src/styles/design-system.css">

  <!-- 404 page specific styles -->
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: var(--spacing-xxl) var(--spacing-md);
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: var(--weight-regular);
      color: var(--color-primary);
      line-height: 1;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .error-message {
      font-family: var(--font-body);
      font-size: var(--text-xl);
      color: var(--color-secondary);
      margin: var(--spacing-md) 0 var(--spacing-lg);
      max-width: 32rem;
    }

    .error-actions {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      justify-content: center;
    }

    .error-link {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-primary);
      text-decoration: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .error-link:hover,
    .error-link:focus {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .error-link-primary {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .error-link-primary:hover,
    .error-link-primary:focus {
      background-color: var(--color-secondary);
      border-color: var(--color-secondary);
    }
  </style>
</head>
<body>
  <portfolio-header data-current-page="" style="view-transition-name: header"></portfolio-header>

  <!-- Page Container - Unified Width Management -->
  <div class="page-container">
    <main style="view-transition-name: main">
      <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">
          The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-actions">
          <a href="/" class="error-link error-link-primary">Return Home</a>
          <a href="/about.html" class="error-link">About</a>
        </div>
      </div>
    </main>
  </div>

  <!-- Main application script for header component -->
  <script type="module" src="/src/pages/main.ts"></script>

  <!-- Mark as JS-loaded for progressive enhancement -->
  <script>
    document.documentElement.classList.add('js-loaded');

    // Remove initial-load class to enable transitions after page is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.documentElement.classList.remove('initial-load');
      }, 50);
    });

    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(() => {
            // Silently fail - PWA is optional enhancement
          });
      });
    }
  </script>
</body>
</html>
